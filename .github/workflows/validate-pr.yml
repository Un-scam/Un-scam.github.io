name: Validate company PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "data/companies.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract base version of companies.json
        run: |
          git show origin/${{ github.base_ref }}:data/companies.json > /tmp/base.json || echo "[]" > /tmp/base.json

      - name: Run validator
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/validate_pr.js /tmp/base.json data/companies.json
